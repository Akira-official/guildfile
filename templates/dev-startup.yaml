# ==============================================================================
# HelixCore Community Blueprint: Developer Startup / Open Source Project
# ==============================================================================
metadata:
  name: "DevHub Community"
  description: "Clean, developer-first Discord template for GitHub repositories and startups."
  version: "1.0.0"
  author: "HelixCore Team"

roles:
  - name: "Core Maintainer"
    color: "#E74C3C"
    hoist: true
    permissions:
      administrator: true
  - name: "Contributor"
    color: "#2ECC71"
    hoist: true
  - name: "Community Helper"
    color: "#3498DB"
    hoist: true
  - name: "Member"
    color: "#95A5A6"
    hoist: false

categories:
  - name: "📌 ┆ WELCOME"
    channels:
      - name: "👋・welcome"
        type: "text"
        read_only: true
      - name: "📜・code-of-conduct"
        type: "text"
        read_only: true
      - name: "📢・releases"
        type: "text"
        read_only: true

  - name: "💻 ┆ DEVELOPMENT"
    channels:
      - name: "💬・general-dev"
        type: "text"
      - name: "🐙・github-feed"
        type: "text"
        topic: "Automated webhook notifications from GitHub."
      - name: "💡・rfc-discussions"
        type: "forum"
      - name: "🐛・issue-triage"
        type: "forum"

  - name: "🔒 ┆ INTERNAL"
    private: true
    allowed_roles:
      - "Core Maintainer"
    channels:
      - name: "💼・maintainer-lounge"
        type: "text"
      - name: "🚨・security-alerts"
        type: "text"
